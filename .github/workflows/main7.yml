name: Hosted macOS Tahoe 26 (Ubuntu BareMetal Bridge)

on:
  workflow_dispatch:

jobs:
  macos-tahoe-desktop:
    # تغییر حیاتی: اجرای کل فرآیند روی لینوکس برای باز شدن درست پلتفرم مک
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. نصب و راه‌اندازی تایل‌اسکیل روی لینوکس جهت ایجاد پل ارتباطی
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale on Ubuntu ===="
          snap install tailscale
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. اجرای توکن BareMetal روی اوبونتو برای بالا آوردن دسکتاپ مک‌اواس
      - name: Provision and Start macOS via BareMetal
        run: |
          echo "==== Executing BareMetal Launch ===="
          curl -fsSL https://baremetal.run/install.sh | bash -s -- cjt_57fa005402dbcda436372abfe878fa678c92fb9d68b403cfb5c1e7b71ad84d30

      # ۳. دریافت آی‌پی و اطلاعات نهایی جهت اتصال راحت‌تر
      - name: Connection Diagnostics
        run: |
          echo "================================================="
          echo "مک‌اواس شما با موفقیت از طریق BareMetal لود شد!"
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "================================================="
          echo "نکته: حالا می‌توانید با استفاده از کلاینت VNC یا ریموت دسکتاپ"
          echo "به آی‌پی تایل‌اسکیل بالا متصل شوید."
          echo "یوزر و پسورد پیش‌فرض توسط خود پلتفرم BareMetal تعیین می‌شود."
          echo "================================================="

      # ۴. زنده نگه داشتن رانر لینوکس به مدت ۲ ساعت
      - name: Keep Infrastructure Alive
        run: |
          sleep 7200
          
