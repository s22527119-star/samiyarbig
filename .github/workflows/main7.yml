name: Hosted macOS Tahoe 26 (Avrea Precision TCC Fix)

on:
  workflow_dispatch:

jobs:
  macos-tahoe-desktop:
    runs-on: avrea-macos-26-16-vcpu # رانر اختصاصی شما

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. اتصال به شبکه امن Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. ساخت کاربر ادمین اختصاصی سامیار
      - name: Create Dedicated Admin User
        run: |
          echo "==== Creating Remote User 'samiyar' ===="
          sudo dscl . -delete /Users/samiyar || true
          sudo dscl . -create /Users/samiyar
          sudo dscl . -create /Users/samiyar UserShell /bin/zsh
          sudo dscl . -create /Users/samiyar RealName "Samiyar Big"
          sudo dscl . -create /Users/samiyar UniqueID "555"
          sudo dscl . -create /Users/samiyar PrimaryGroupID 20
          sudo dscl . -create /Users/samiyar NFSHomeDirectory /Users/samiyar
          sudo dscl . -passwd /Users/samiyar mac2026!
          sudo dscl . -append /Groups/admin GroupMembership samiyar
          sudo mkdir -p /Users/samiyar
          sudo chown -R samiyar:staff /Users/samiyar
          
          # تنظیم لایه گرافیکی لاگین خودکار روی یوزر سامیار
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser samiyar
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true

      # ۳. تزریق صریح مجوزهای Screen Recording و Accessibility به دیتابیس TCC (حل قطعی صفحه سیاه)
      - name: Inject Explicit Screen Recording & ARD Permissions into TCC.db
        run: |
          echo "==== Injecting kTCCServiceScreenCapture Paths ===="
          TIMESTAMP=$(date +%s)
          
          # مسیر دیتابیس TCC سیستم و یوزر
          SYSTEM_TCC="/Library/Application Support/com.apple.TCC/TCC.db"
          USER_TCC="/Users/samiyar/Library/Application Support/com.apple.TCC/TCC.db"
          
          # مطمئن شدن از وجود دایرکتوری TCC یوزر
          mkdir -p "/Users/samiyar/Library/Application Support/com.apple.TCC"
          
          # فرمت تزریق برای ساختار مک‌های جدید (Sequoia / Tahoe) برای سرویس‌های اصلی ریموت دسکتاپ و اسکرین کپچر
          # مجوز دادن به com.apple.screensharingd
          sudo sqlite3 "$SYSTEM_TCC" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharingd',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TIMESTAMP);" 2>/dev/null || true
          sudo sqlite3 "$SYSTEM_TCC" "INSERT OR REPLACE INTO access VALUES('kTCCServicePostEvent','com.apple.screensharingd',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TIMESTAMP);" 2>/dev/null || true
          
          # مجوز دادن به ARDAgent و RemoteManagement
          sudo sqlite3 "$SYSTEM_TCC" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteManagement.RemoteManagementAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TIMESTAMP);" 2>/dev/null || true
          sudo sqlite3 "$SYSTEM_TCC" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.Terminal',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TIMESTAMP);" 2>/dev/null || true
          
          # اعمال همین ساختار روی دیتابیس TCC یوزر سامیار جهت اطمینان ۱۰۰٪
          sqlite3 "$USER_TCC" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharingd',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TIMESTAMP);" 2>/dev/null || true
          sqlite3 "$USER_TCC" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteManagement.RemoteManagementAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TIMESTAMP);" 2>/dev/null || true
          
          # اصلاح مالکیت فایل دیتابیس یوزر
          sudo chown -R samiyar:staff "/Users/samiyar/Library/Application Support/com.apple.TCC"
          echo "TCC Database Successfully Patched."

      # ۴. فعال‌سازی و کانفیگ قطعی ARDAgent و Screen Sharing از طریق مسیر فیزیکی kickstart
      - name: Force Start Apple Remote Management (ARDAgent Kickstart)
        run: |
          echo "==== Activating ARDAgent through CoreServices Kickstart ===="
          ARD_KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          
          # غیرفعال کردن اولیه برای پاکسازی سشن‌های قفل شده قدیمی
          sudo $ARD_KICKSTART -deactivate -stop || true
          
          # کانفیگ کامل دسترسی برای همه پورت‌ها و ویژگی‌ها
          sudo $ARD_KICKSTART -configure -allowAccessFor -allUsers -privs -all
          
          # تنظیم پسورد VNC به عنوان لایه دوم بک‌آپ در کنار Mac Authentication
          sudo $ARD_KICKSTART -configure -clientopts -setvnclegacy yes -setvncpw -vncpw mac2026!
          
          # راه‌اندازی مجدد اکتیو ایجنت ریموت
          sudo $ARD_KICKSTART -activate -start -restart -agent
          
          # ری‌استارت بومی دیمون اسکرین شیرینگ برای لود کردن ساختار جدید TCC
          sudo launchctl bootout system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo pkill screensharingd || true

      # ۵. تنظیم و نصب ساختار صدا
      - name: Setup Audio Infrastructure
        run: |
          echo "==== Configuring BlackHole Audio ===="
          brew install blackhole-2ch || true
          brew install switchaudio-osx || true
          sudo killall coreaudiod || true
          sleep 2
          SwitchAudioSource -s "BlackHole 2ch" || true

      # ۶. ربات فعال کلیک خودکار در پس‌زمینه برای پاپ‌آپ‌های ناگهانی احتمالی
      - name: Start Background TCC Auto-Approver Bot
        run: |
          cat << 'EOF' > tcc_bot.sh
          #!/bin/bash
          while true; do
            osascript -e 'tell application "System Events" to click button "Allow" of window 1 of application process "NotificationCenter"' 2>/dev/null
            osascript -e 'tell application "System Events" to click button "OK" of window 1 of application process "CoreServicesUIAgent"' 2>/dev/null
            osascript -e 'tell application "System Events" to click button "Allow" of window 1 of application process "WindowServer"' 2>/dev/null
            sleep 3
          done
          EOF
          chmod +x tcc_bot.sh
          ./tcc_bot.sh &

      # ۷. راه‌اندازی مجدد لایه گرافیکی تاهو جهت لود دسکتاپ مجازی (Headless Fix)
      - name: Force WindowServer Reset to Initialize Virtual Framebuffer
        run: |
          echo "==== Forcing WindowServer To Render Headless Screen ===="
          sudo killall -9 WindowServer || true
          sleep 5
          sudo caffeinate -u -d -i -s -t 7200 &

      # ۸. چاپ اطلاعات نهایی اتصال
      - name: Connection Details
        run: |
          echo "==== Tahoe Engine Setup Complete ===="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Username: samiyar"
          echo "Password: mac2026!"
          echo "------------------------------------------------"
          echo "If Mac User auth fails, you can now also use VNC Password: mac2026!"
          echo "------------------------------------------------"

      # ۹. زنده نگه داشتن سرور
      - name: Keep Runner Alive
        run: |
          sleep 7200
          
