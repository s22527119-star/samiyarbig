name: Hosted macOS Tahoe 26 (Avrea 16vCPU Precision Fix)

on:
  workflow_dispatch:

jobs:
  macos-tahoe-desktop:
    runs-on: avrea-macos-26-16-vcpu # رانر اختصاصی شما با مک‌اواس ۲۶ (Tahoe)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. اتصال به شبکه امن Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. ساخت کاربر ادمین اختصاصی برای لود شدن دسکتاپ واقعی Tahoe
      - name: Create Dedicated Admin User for Tahoe
        run: |
          echo "==== Creating Remote User 'samiyar' ===="
          sudo dscl . -delete /Users/samiyar || true
          
          sudo dscl . -create /Users/samiyar
          sudo dscl . -create /Users/samiyar UserShell /bin/zsh
          sudo dscl . -create /Users/samiyar RealName "Samiyar Big"
          sudo dscl . -create /Users/samiyar UniqueID "555"
          sudo dscl . -create /Users/samiyar PrimaryGroupID 20
          sudo dscl . -create /Users/samiyar NFSHomeDirectory /Users/samiyar
          
          # ست کردن رمز عبور ثابت
          sudo dscl . -passwd /Users/samiyar mac2026!
          
          # ارتقا به سطح دسترسی ادمین جهت مدیریت پاپ‌آپ‌ها
          sudo dscl . -append /Groups/admin GroupMembership samiyar
          
          # ساخت دایرکتوری خانگی و اصلاح مالکیت فایل‌ها
          sudo mkdir -p /Users/samiyar
          sudo chown -R samiyar:staff /Users/samiyar
          
          # تنظیم لاگین خودکار برای فعال شدن سشن گرافیکی واقعی در لایه WindowServer
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser samiyar
          
          # غیرفعال کردن مودهای به خواب رفتن سیستم
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true

      # ۳. فعال‌سازی ریموت منجمنت بومی اپل (بدون استفاده از لایه Legacy VNC)
      - name: Configure Apple Remote Management (Bypass Black Screen)
        run: |
          echo "==== Activating Native Remote Management ===="
          
          # فعال‌سازی کامپوننت اصلی مدیریت از راه دور سیستم
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate
          
          # اعطای دسترسی کامل به تمام یوزرهای ادمین (جلوگیری از بلاک شدن تصویر توسط TCC)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          
          # ری‌استارت سرویس ریموت برای اعمال تغییرات بدون ست کردن پسورد سنتی VNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

      # ۴. نصب و فعال‌سازی زیرساخت‌های صوتی مجازی
      - name: Setup Audio Infrastructure
        run: |
          echo "==== Configuring BlackHole Audio for Tahoe ===="
          brew install blackhole-2ch || true
          brew install switchaudio-osx || true
          sudo killall coreaudiod || true
          sleep 2
          SwitchAudioSource -s "BlackHole 2ch" || true

      # ۵. ربات پس‌زمینه برای کلیک خودکار و تایید مجوزهای مخفی Screen Recording و Audio
      - name: Start Background TCC Auto-Approver Bot
        run: |
          echo "==== Starting Auto-Clicker Bot for Tahoe Privacy Prompts ===="
          cat << 'EOF' > tcc_bot.sh
          #!/bin/bash
          while true; do
            # کلیک خودکار روی دکمه Allow یا OK برای تمامی پاپ‌آپ‌های حریم خصوصی مربوط به تصویر و صدا
            osascript -e 'tell application "System Events" to click button "Allow" of window 1 of application process "NotificationCenter"' 2>/dev/null
            osascript -e 'tell application "System Events" to click button "OK" of window 1 of application process "CoreServicesUIAgent"' 2>/dev/null
            osascript -e 'tell application "System Events" to click button "Allow" of window 1 of application process "WindowServer"' 2>/dev/null
            sleep 3
          done
          EOF
          chmod +x tcc_bot.sh
          ./tcc_bot.sh &
          echo "Bot is successfully running in background..."

      # ۶. راه‌اندازی مجدد موتور گرافیکی جهت شکستن قفل صفحه سیاه و اعمال لاگین خودکار
      - name: Force WindowServer Reset
        run: |
          echo "==== Resetting Graphic Server to Force User Session ===="
          sudo killall -9 WindowServer || true
          sleep 5
          sudo caffeinate -u -d -i -s -t 7200 &

      # ۷. ارائه اطلاعات اتصال دقیق و حیاتی
      - name: Connection Guide for macOS Tahoe
        run: |
          echo "==== Tahoe Engine Configuration Completed ===="
          echo "------------------------------------------------"
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Username: samiyar"
          echo "Password: mac2026!"
          echo "------------------------------------------------"
          echo "🔴 IMPORTANT DIRECTION FOR REALVNC / CLIENTS:"
          echo "1. Do NOT choose 'VNC Password' authentication in your client settings."
          echo "2. Change 'Authentication' method to 'Mac User' or 'Standard Username/Password'."
          echo "3. Enter Username: samiyar and Password: mac2026!"
          echo "4. This uses Apple's native secure pipeline, bypassing the Tahoe Screen Capture block entirely!"
          echo "------------------------------------------------"

      # ۸. زنده نگه داشتن سرور جهت کار شما
      - name: Keep Runner Alive
        run: |
          sleep 7200
          
