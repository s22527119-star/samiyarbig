name: 'Terraform macOS Live GUI'

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform on macOS with GUI'
    runs-on: macos-latest
    environment: production

    defaults:
      run:
        shell: bash

    steps:
    # ۱. واکشی کدهای مخزن
    - name: Checkout
      uses: actions/checkout@v4

    # ۲. نصب و راه‌اندازی بومی و دستی Tailscale با قابلیت Accept Routes
    - name: Install and Connect Tailscale (Manual Control)
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        echo "==== [۱] نصب Tailscale روی مک‌اواس ===="
        brew install tailscale
        
        echo "==== [۲] راه‌اندازی ورکر و دیمن Tailscale ===="
        sudo brew services start tailscale
        sleep 5
        
        echo "==== [۳] اتصال به شبکه با کلید اختصاصی و تنظیمات روت ===="
        sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --accept-routes
        
        echo "==== [۴] تایید وضعیت اتصال ===="
        tailscale status

    # ۳. فعال‌سازی GUI، محیط صوتی، VNC، تنظیم پسورد یوزر و فعال‌سازی Screen Recording
    - name: Enable macOS GUI, VNC, Audio & Input Control
      run: |
        echo "==== [۱] تنظیم پسورد برای کاربر سیستم (runner) ===="
        # تنظیم رمز عبور macosuser123 برای کاربر جاری جهت لاگین در محیط گرافیکی
        sudo dscl . -passwd /Users/runner macosuser123
        
        echo "==== [۲] تزریق دسترسی Screen Recording و کنترل سیستم به سرویس VNC ===="
        # اضافه کردن دسترسی ضبط صفحه و مدیریت سیستم به ایجنت‌های گرافیکی اپل در دیتابیس امنیتی TCC
        sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteManagementAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER));"
        sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.RemoteManagementAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER));"
        
        echo "==== [۳] فعال‌سازی اشتراک‌گذاری دسکتاپ و مدیریت از راه دور ===="
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on -restart -agent -privs -all -allowAccessFor -allUsers
        
        # تنظیم رمز عبور پروتکل VNC
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -configure -clientopts -setvncpasswd -vncpasswd macOSVNC@123
        
        echo "==== [۴] راه‌اندازی و باز کردن لایه صوتی سیستم ===="
        sudo nvram SystemAudioVolume=%80 || true
        sudo systemsetup -setsetsystemstartupaudio on || true
        
        echo "==== [۵] اطلاعات نهایی اتصال ===="
        echo "=================================================="
        echo "  آی‌پی مک شما در شبکه Tailscale:"
        tailscale ip -4
        echo "  رمز اتصال اوليه VNC (در نرم‌افزار): macOSVNC@123"
        echo "  نام کاربری دسکتاپ مک: runner"
        echo "  رمز عبور دسکتاپ مک (صفحه لاگین): macosuser123"
        echo "=================================================="

    # ۴. نصب و تنظیم ترافورم روی مک‌اواس
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # ۵. سناریو دوم: ساخت فایل ترافورم نمونه برای جلوگیری از ارور نبود کانفیگ
    - name: Create Dummy Terraform File
      run: |
        cat <<EOF > main.tf
        terraform {
        }
        resource "null_resource" "dummy" {
          triggers = {
            value = "Hello macOS"
          }
        }
        EOF

    # ۶. اجرای مراحل استاندارد ترافورم
    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -input=false

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

    # ۷. زنده نگه داشتن سرور جهت اتصال و کار با محیط گرافیکی مک
    - name: Keep Runner Alive for Remote Desktop Access
      if: always()
      run: |
        echo "اتاق کنترل گرافیکی به مدت ۱ ساعت باز است."
        echo "می‌توانید متصل شوید..."
        sleep 3600
        
