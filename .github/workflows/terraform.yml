name: 'Terraform macOS Live GUI'

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform on macOS with GUI'
    runs-on: macos-latest
    environment: production

    # بخش defaults بالا را حذف یا به حالت استاندارد برگرداندیم تا رانر در لایه روت به مشکل نخورد
    defaults:
      run:
        shell: bash

    steps:
    # ۱. واکشی کدهای مخزن (این کار پوشه‌ها را می‌سازد)
    - name: Checkout
      uses: actions/checkout@v4

    # ۲. نصب و راه‌اندازی بومی و دستی Tailscale با قابلیت Accept Routes
    - name: Install and Connect Tailscale (Manual Control)
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        echo "==== [۱] نصب Tailscale روی مک‌اواس ===="
        brew install tailscale
        
        echo "==== [۲] راه‌اندازی ورکر و دیمن Tailscale ===="
        sudo brew services start tailscale
        sleep 5
        
        echo "==== [۳] اتصال به شبکه با کلید اختصاصی و تنظیمات روت ===="
        sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --accept-routes
        
        echo "==== [۴] تایید وضعیت اتصال ===="
        tailscale status

    # ۳. فعال‌سازی GUI، محیط صوتی، VNC و دسترسی کامل کیبورد/ماوس
    - name: Enable macOS GUI, VNC, Audio & Input Control
      run: |
        echo "==== [۱] فعال‌سازی اشتراک‌گذاری دسکتاپ و مدیریت از راه دور ===="
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on -restart -agent -privs -all -allowAccessFor -allUsers
        
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -configure -clientopts -setvncpasswd -vncpasswd macOSVNC@123
        
        echo "==== [۲] راه‌اندازی و باز کردن لایه صوتی سیستم ===="
        sudo nvram SystemAudioVolume=%80 || true
        sudo systemsetup -setsetsystemstartupaudio on || true
        
        echo "==== [۳] دریافت و نمایش آی‌پای اختصاصی شما در شبکه Tailscale ===="
        echo "=================================================="
        echo "  آی‌پی مک شما برای اتصال VNC Viewer:"
        tailscale ip -4
        echo "  رمز عبور اتصال VNC شما: macOSVNC@123"
        echo "=================================================="

    # ۴. نصب و تنظیم ترافورم روی مک‌اواس
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # ۵. اجرای مراحل استاندارد ترافورم (حالا پوشه را فقط به این استپ‌ها محدود کردیم)
    - name: Terraform Init
      working-directory: ./terraform  # <--- انتقال مسیر اختصاصی به اینجا
      run: terraform init

    - name: Terraform Format
      working-directory: ./terraform  # <--- انتقال مسیر اختصاصی به اینجا
      run: terraform fmt -check

    - name: Terraform Plan
      working-directory: ./terraform  # <--- انتقال مسیر اختصاصی به اینجا
      run: terraform plan -input=false

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      working-directory: ./terraform  # <--- انتقال مسیر اختصاصی به اینجا
      run: terraform apply -auto-approve -input=false

    # ۶. زنده نگه داشتن سرور جهت اتصال و کار با محیط گرافیکی مک (حتی در صورت ارور ترافورم)
    - name: Keep Runner Alive for Remote Desktop Access
      if: always()
      run: |
        echo "اتاق کنترل گرافیکی به مدت ۱ ساعت باز است."
        echo "می‌توانید با نرم‌افزار VNC Viewer به آی‌پی اختصاصی مشخص شده در مرحله ۳ متصل شوید..."
        sleep 3600
        
