name: Connect via WireGuard VPN

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  wireguard-vpn:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create WireGuard Config
        env:
          WG_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          mkdir -p /tmp/wg-config
          echo "$WG_CONFIG" > /tmp/wg-config/wg0.conf
          chmod 600 /tmp/wg-config/wg0.conf
          echo "WireGuard config created"

      - name: Start WireGuard Container
        run: |
          docker run -d \
            --name=wireguard \
            --cap-add=NET_ADMIN \
            --cap-add=SYS_MODULE \
            -e PUID=1000 \
            -e PGID=1000 \
            -v /tmp/wg-config:/config \
            --sysctl="net.ipv4.conf.all.src_valid_mark=1" \
            linuxserver/wireguard:latest
          
          echo "Waiting for WireGuard to connect..."
          sleep 15
          
          echo "=== Connection Status ==="
          docker exec wireguard wg show

      - name: Your Task 1
        run: |
          echo "VPN is running..."
          docker exec wireguard curl -s ifconfig.me

      - name: Your Task 2
        run: |
          echo "VPN still running..."
          docker exec wireguard ping -c 3 8.8.8.8

      - name: Your Task 3
        run: |
          echo "VPN still active!"
          # هر کاری که نیاز دارید انجام بدید
