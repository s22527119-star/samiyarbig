name: Connect via WireGuard VPN

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  wireguard-vpn:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create WireGuard Config
        env:
          WG_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          # ایجاد دایرکتوری برای کانفیگ
          mkdir -p /tmp/wg-config
          echo "$WG_CONFIG" > /tmp/wg-config/wg0.conf
          chmod 600 /tmp/wg-config/wg0.conf
          
          echo "WireGuard config created successfully"

      - name: Start WireGuard Container
        run: |
          # اجرای کانتینر WireGuard
          docker run -d \
            --name=wireguard \
            --cap-add=NET_ADMIN \
            --cap-add=SYS_MODULE \
            -e PUID=1000 \
            -e PGID=1000 \
            -v /tmp/wg-config:/config \
            --sysctl="net.ipv4.conf.all.src_valid_mark=1" \
            linuxserver/wireguard:latest
          
          echo "Waiting for WireGuard to connect..."
          sleep 10
          
          # بررسی وضعیت کانتینر
          docker logs wireguard

      - name: Test Connection
        run: |
          echo "=== Checking Docker container ==="
          docker ps | grep wireguard
          
          echo "=== WireGuard Status ==="
          docker exec wireguard wg show
          
          echo "=== Test VPN Connection ==="
          docker exec wireguard curl -s --max-time 10 ifconfig.me || echo "Using internal network"
          
          # تست دسترسی به شبکه داخلی
          # docker exec wireguard ping -c 3 10.0.0.1

      - name: Run Your Tasks via VPN
        run: |
          # مثال: دسترسی به سرویس داخلی
          echo "Accessing internal service through VPN..."
          
          # از طریق کانتینر دستورات را اجرا کنید
          docker exec wireguard curl -s http://your-internal-service.local || true
          
          # یا اگر نیاز به پروکسی دارید:
          # docker run --rm --network container:wireguard curlimages/curl:latest http://internal-api.local
