name: Connect via WireGuard VPN

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  wireguard-connect:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WireGuard Tools and wireguard-go
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools resolvconf
          
          # نصب wireguard-go (userspace implementation)
          wget https://github.com/amnezia-vpn/amneziawg-go/releases/download/v0.2.12/amneziawg-go-linux-amd64.tar.gz
          tar -xzf amneziawg-go-linux-amd64.tar.gz
          sudo mv amneziawg-go /usr/local/bin/
          sudo chmod +x /usr/local/bin/amneziawg-go
          
          # یا استفاده از wireguard-go اصلی
          # sudo apt-get install -y golang-go
          # git clone https://git.zx2c4.com/wireguard-go
          # cd wireguard-go && make && sudo mv wireguard-go /usr/local/bin/

      - name: Setup WireGuard Config
        env:
          WG_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          # ذخیره کانفیگ
          echo "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          
          # نمایش کانفیگ (بدون کلید خصوصی)
          sudo cat /etc/wireguard/wg0.conf | grep -v PrivateKey

      - name: Start wireguard-go in background
        run: |
          # ایجاد اینترفیس tun
          export WG_TUN_NAME=wg0
          sudo ip tuntap add dev $WG_TUN_NAME mode tun || true
          
          # اجرای wireguard-go در بکگراند
          export LOG_LEVEL=debug
          sudo -E wireguard-go $WG_TUN_NAME &
          sleep 2
          
          # تنظیم آدرس IP
          sudo ip addr add 10.0.0.2/24 dev $WG_TUN_NAME || true
          
          # بالا آوردن اینترفیس
          sudo ip link set up dev $WG_TUN_NAME
          
          # اعمال کانفیگ
          sudo wg setconf $WG_TUN_NAME /etc/wireguard/wg0.conf
          
          echo "=== WireGuard Status ==="
          sudo wg show
          
          # تست اتصال
          sleep 2
          ping -c 3 10.0.0.1 || echo "Ping failed, but continuing..."

      - name: Add route for VPN traffic
        run: |
          # اضافه کردن route (اگر فقط شبکه داخلی نیاز دارید)
          sudo ip route add 10.0.0.0/24 dev wg0 || true
          
          # یا برای تمام ترافیک (با احتیاط!)
          # sudo ip route add default dev wg0 table 100 || true
          # sudo ip rule add from all lookup 100 || true

      - name: Use VPN Connection
        run: |
          echo "VPN should be connected. Routing table:"
          ip route show
          
          echo "Testing connection via VPN interface:"
          curl --interface wg0 --connect-timeout 5 http://10.0.0.1 || echo "Service not reachable, but VPN is up"
          
          # کارهای شما اینجا...

      - name: Cleanup VPN
        if: always()
        run: |
          echo "Cleaning up..."
          sudo ip link del wg0 2>/dev/null || true
          sudo killall wireguard-go 2>/dev/null || true
          echo "Cleanup completed"
