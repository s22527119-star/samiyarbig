name: OS QEMU noVNC Secure

on:
  workflow_dispatch:

jobs:
  vm-job:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU, noVNC, and Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 novnc websockify wget
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Download ISO
        run: |
          mkdir -p iso
          # هشدار: این لینک مربوط به macOS Sonoma است و با تنظیمات فعلی بوت نخواهد شد!
          wget -O iso/os.iso "https://archive.org/download/macOS-X-images/Sonoma%2014.iso"

      - name: Create disk
        run: |
          qemu-img create -f qcow2 main.img 50G

      - name: Start VM (Optimized with MTTCG)
        run: |
          # استفاده از TCG چند نخی برای نهایت سرعت در غیاب KVM
          qemu-system-x86_64 \
            -m 6144 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -accel tcg,thread=multi \
            -cpu max \
            -machine type=q35 \
            -drive file=main.img,format=qcow2 \
            -cdrom iso/os.iso \
            -boot d \
            -vga virtio \
            -net nic -net user \
            -usb -device usb-tablet \
            -vnc 127.0.0.1:1 \
            -monitor none \
            -daemonize

      - name: Start noVNC (Local)
        run: |
          websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5901 --daemon

      - name: Start Cloudflare Web Tunnel
        run: |
          echo "=========================================================="
          echo "Starting Cloudflare Tunnel..."
          echo "Please check the logs below for the TryCloudflare URL!"
          echo "=========================================================="
          cloudflared tunnel --url http://127.0.0.1:6080
          
