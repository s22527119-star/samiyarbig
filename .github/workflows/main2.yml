name: Windows QEMU noVNC Secure

on:
  workflow_dispatch:

jobs:
  win-vm:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU, noVNC, and Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 novnc websockify wget
          # دانلود و نصب Cloudflared برای تانل
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Download Windows ISO
        run: |
          mkdir -p iso
          # نکته: لینکی که قرار دادید مربوط به Windows 7 است نه 11.
          wget -O iso/Win.iso "https://archive.org/download/mul_windows_7_enterprise_with_sp1_x64_dvd_u_677651-Archive/mul_windows_7_enterprise_jun_2024_x64_custom.iso"

      - name: Create disk
        run: |
          qemu-img create -f qcow2 win.img 50G

      - name: Start Windows VM
        run: |
          # مقادیر RAM و KVM به دلیل محدودیت‌های گیت‌هاب اکشنز تغییر کردند
          qemu-system-x86_64 \
            -m 16035 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -machine type=q35 \
            -cpu max \
            -accel tcg,thread=multi \
            -drive file=win.img,format=qcow2 \
            -cdrom iso/Win.iso \
            -boot d \
            -vga virtio \
            -net nic -net user \
            -usb -device usb-tablet \
            -vnc 127.0.0.1:1 \
            -monitor none \
            -daemonize

      - name: Start noVNC (Local)
        run: |
          # اجرای websockify برای تبدیل VNC به WebSockets
          websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5901 --daemon

      - name: Start Cloudflare Web Tunnel
        run: |
          echo "=========================================================="
          echo "Starting Cloudflare Tunnel..."
          echo "Please check the logs below for the TryCloudflare URL!"
          echo "=========================================================="
          # ایجاد یک تانل موقت که ترافیک پورت 6080 را روی اینترنت در دسترس قرار می‌دهد
          cloudflared tunnel --url http://127.0.0.1:6080
          
