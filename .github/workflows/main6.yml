name: Hosted macOS 16vCPU Environment

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: avrea-macos-26-16-vcpu 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. تنظیم رمز عبور برای اکانت اصلی رانر با استفاده از اسکریپت امضا شده اَپل
      # این دستور قفل امنیتی سشن رو باز می‌کنه
      - name: Set Runner Password
        run: |
          echo "==== Setting Password ===="
          sudo dscl . -passwd /Users/runner "RunnerMac2026" || true
          
      # ۲. نصب و راه‌اندازی Tailscale
      - name: Install Tailscale via Homebrew
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true

      # ۳. اتصال به شبکه Tailscale
      - name: Connect Tailscale
        run: |
          echo "==== Starting Tailscale Connection ===="
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۴. استارت زنده و بومی سرویس اشتراک‌گذاری دسکتاپ مک
      - name: Start Native macOS Screen Sharing
        run: |
          echo "==== Launching Apple Screen Sharing ===="
          sudo launchctl activate system/com.apple.screensharing
          
      # ۵. دریافت آی‌پی برای اتصال
      - name: Get Runner IP Address
        run: |
          echo "==== Connection Details ===="
          echo "Your Tailscale IP is:"
          tailscale ip -4
          echo "Username: runner"
          echo "Password: RunnerMac2026"

      # ۶. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "Runner is perfectly running with 16 vCPUs."
          sleep 7200
          
