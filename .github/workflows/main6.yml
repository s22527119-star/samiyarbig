name: Hosted macOS 16vCPU Environment

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: avrea-macos-26-16-vcpu 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. نصب Tailscale و TigerVNC از طریق Brew
      - name: Install Tailscale and TigerVNC via Homebrew
        run: |
          echo "==== Installing Dependencies ===="
          brew install tailscale tigervnc
          
          echo "==== Starting Tailscale Daemon ===="
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo ln -s /usr/local/bin/tailscale /usr/bin/tailscale || true

      # ۲. اتصال به شبکه Tailscale
      - name: Connect Tailscale
        run: |
          echo "==== Starting Tailscale Connection ===="
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۳. راه‌اندازی شبیه‌ساز نمایشگر و سرور VNC مستقل
      - name: Start Independent VNC Server
        run: |
          echo "==== Configuring TigerVNC ===="
          # ساخت پوشه کانفیگ VNC برای کاربر فعلی
          mkdir -p ~/.vnc
          
          # تنظیم مستقیم رمز عبور VNC بدون واسطه اپل (رمز: VncPassword123)
          echo "VncPassword123" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          echo "==== Launching VNC Server ===="
          # اجرای سرور روی دیسپلی :1 (پورت 5901) با دور زدن سکیوریتی اپل
          vncserver :1 -geometry 1280x720 -depth 24
          
      # ۴. نمایش آی‌پي اختصاصی جهت اتصال
      - name: Get Runner IP Address
        run: |
          echo "==== Connection Details ===="
          echo "Your Tailscale IP is:"
          tailscale ip -4
          echo "Connect to: <YOUR_TAILSCALE_IP>:5901"

      # ۵. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "Runner is running with 16 vCPUs. TigerVNC is active."
          sleep 7200
          
