name: Hosted macOS 16vCPU (Sunshine Audio/Video Fix)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: avrea-macos-26-16-vcpu 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. اتصال به Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. معرفی مخزن LizardByte و نصب دقیق Sunshine
      - name: Install Sunshine Server from LizardByte
        run: |
          echo "==== Adding LizardByte Tap and Installing Sunshine ===="
          # اضافه کردن مخزن رسمی سان‌شاین به هوم‌برو
          brew tap lizardbyte/sunshine
          # نصب برنامه با آدرس‌دهی دقیق پکیج
          brew install sunshine

      # ۳. اعطای دسترسی مستقیم Screen Recording به Sunshine در هسته مک
      - name: Bypass Screen Recording Privacy Guards (TCC Injection)
        run: |
          echo "==== Injecting Screen Recording Permissions ===="
          # پیدا کردن مسیر دقیق باینری Sunshine نصب شده
          SUNSHINE_PATH=$(which sunshine || echo "/opt/homebrew/bin/sunshine")
          
          # تزریق مستقیم مجوز ضبط صفحه و دسترسی‌های سیستمی به دیتابیس امنیتی مک ۲۶
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$SUNSHINE_PATH',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','$SUNSHINE_PATH',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          
          # اعمال و رفرش کردن دسترسی‌های جدید سیستم‌عامل Tahoe
          sudo tccutil reset ScreenCapture || true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement PrivacyInquiry -bool false || true

      # ۴. نصب و پیکربندی خروجی و ضبط صدا (Screen Recording Audio)
      - name: Install and Route Screen Audio Driver
        run: |
          echo "==== Installing BlackHole Audio Driver ===="
          brew install blackhole-2ch
          
          # بیدار کردن و لود مجدد سیستم صوتی مک
          sudo killall coreaudiod || true
          sleep 3
          
          echo "==== Routing macOS System Audio to Virtual Driver ===="
          # ست کردن کارت صدای مجازی BlackHole به عنوان خروجی اصلی صدا در مک برای ضبط توسط Sunshine
          sudo SwitchAudioSource -s "BlackHole 2ch" || true

      # ۵. بیدارباش گرافیک و فریم‌بافر دسکتاپ
      - name: Configure Virtual Framebuffer
        run: |
          echo "==== Keeping Video Framebuffer Alive ===="
          # بیدار نگه داشتن دسکتاپ و سیستم کپچر تصویر
          sudo caffeinate -u -d -i -s -t 7200 &
          sleep 2

      # ۶. راه‌اندازی سرور استریمینگ Sunshine
      - name: Start Sunshine Server
        run: |
          echo "==== Starting Sunshine with Audio/Video Capture Enabled ===="
          # اجرای سان‌شاین با دسترسی بالا جهت اعمال دسترسی تصویر و صدا
          nohup sudo sunshine > /dev/null 2>&1 &
          sleep 5

      # ۷. نمایش اطلاعات اتصال
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect via Sunshine ===="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Sunshine Web UI: https://$(tailscale ip -4):47990"
          echo "------------------------------------------------"
          echo "1. Open the Web UI link in your browser."
          echo "2. Create a username and password."
          echo "3. Open 'Moonlight' client on your PC/Phone and enter the IP."

      # ۸. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "==== Runner is alive and streaming ===="
          sleep 7200
          
