name: Hosted macOS 16vCPU Environment

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: avrea-macos-26-16-vcpu 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. نصب Tailscale با استفاده از Homebrew و لینک کردن خط فرمان
      - name: Install Tailscale via Homebrew
        run: |
          echo "==== Installing Tailscale with Homebrew ===="
          brew install tailscale
          
          echo "==== Starting Tailscale Daemon ===="
          # شروع به کار سرویس بک‌گراند تیل‌اسکیل در مک
          sudo brew services start tailscale
          
          # ایجاد لینک برای دسترسی مستقیم به دستور tailscale در سراسر سیستم
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo ln -s /usr/local/bin/tailscale /usr/bin/tailscale || true

      # ۲. اتصال به شبکه Tailscale
      - name: Connect Tailscale
        run: |
          echo "==== Starting Tailscale Connection ===="
          # احراز هویت با استفاده از کلید سکرت شما
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۳. فعال‌سازی VNC بومی سیستم‌عامل macOS
      - name: Enable macOS VNC
        run: |
          echo "==== Configuring VNC (Screen Sharing) ===="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvncmanaged -vncmanaged -initialation
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvncpw -vncpw "VncPassword123"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

      # ۴. نمایش آی‌پي اختصاصی جهت اتصال
      - name: Get Runner IP Address
        run: |
          echo "==== Connection Details ===="
          echo "Your Tailscale IP is:"
          tailscale ip -4

      # ۵. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "Runner is running with 16 vCPUs. Connect via VNC now."
          sleep 7200
          
