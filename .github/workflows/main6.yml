name: macOS Tahoe Remote Desktop (NoMachine + Tailscale)

on:
  workflow_dispatch: # اجرای دستی ورک‌فلو از پنل گیت‌هاب

jobs:
  setup-remote-desktop:
    runs-on: namespace-profile-samiyarbig # اجرای روی جدیدترین نسخه مک‌او‌اس ارائه شده توسط گیت‌هاب
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install NoMachine and Tailscale via Homebrew
        run: |
          echo "=== 1. INSTALLING SOFTWARE ==="
          # نصب تیل‌اسکیل به صورت عادی
          brew install --cask tailscale
          
          # دانلود و نصب نوماشین با دور زدن خطای چک‌سام (SHA-256)
          brew install --cask --ignore-dependencies --no-quarantine --skip-cask-deps --force nomachine || true
          
          # اگر هوم‌برو باز هم لجبازی کرد، فایل رسمی را مستقیم دانلود و نصب اجباری می‌کنیم
          if [ ! -d "/Applications/NoMachine.app" ]; then
            echo "Homebrew failed, switching to direct installation..."
            curl -A "Mozilla/5.0" -L -o nomachine.dmg "https://download.nomachine.com/download/8.14/MacOSX/nomachine_8.14.2_1_arm64.dmg"
            sudo hdiutil attach nomachine.dmg
            sudo installer -pkg /Volumes/NoMachine/NoMachine.pkg -target /
          fi


      - name: Configure Virtual Display, Audio, and Input Controls
        run: |
          echo "=== 2. CONFIGURING NOMACHINE FOR GITHUB ACTIONS RUNNER ==="
          # تعریف ابعاد مانیتور مجازی برای جلوگیری از سیاه شدن صفحه
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey ScreenResolution 1920x1080
          
          # ایجاد کارت گرافیک و مانیتور مجازی مجزا در هسته سیستم‌عامل
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --virtualdisplay add --shared
          
          # فعال‌سازی و اعطای دسترسی‌های کامل به کیبورد، ماوس و استریم صدا
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey PhysicalDisplayAllowVirtualInbound yes
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey EnableUserInterface yes
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey EnableAudioStreaming yes
          
          # اضافه کردن یوزر رانر گیت‌هاب به لیست مجاز ورودی‌های سخت‌افزاری نوماشین
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --ruleadd user=runner class=input service=yes
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --ruleadd user=runner class=audio service=yes
          
          # راه اندازی مجدد سرویس برای بارگذاری درایورهای صوتی و تصویری مجازی
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --restart

      - name: Prevent macOS Virtual Graphics from Sleeping
        run: |
          echo "=== 3. KEEPING GRAPHICS FRAMEBUFFER ALIVE ==="
          # بیدار نگه داشتن دسکتاپ مجازی مک به مدت ۶ ساعت (۲۱۶۰۰ ثانیه) در پس‌زمینه
          sudo caffeinate -u -d -t 21600 &

      - name: Start and Authenticate Tailscale Network
        env:
          # اختیاری: اگر می‌خواهی بدون کلیک روی لینک متصل شوی، یک Auth Key از پنل تیل‌اسکیل بساز و در Secrets گیت‌هاب ست کن.
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo "=== 4. LAUNCHING TAILSCALE ==="
          # اجرای دیمون اصلی تیل‌اسکیل
          sudo open -a Tailscale --args --no-window
          sleep 5
          
          # اتصال به شبکه؛ اگر Auth Key وجود داشته باشد خودکار متصل می‌شود، در غیر این صورت لینک لاگین چاپ می‌شود
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "Please click the link below to authenticate the runner:"
            sudo tailscale up
          else
            sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY
          fi

      - name: Output Connection Details and Keep Alive
        run: |
          echo "=== 5. CONNECTION DETAILS ==="
          echo "----------------------------------------"
          echo "Your Tailscale IPv4 address is:"
          tailscale ip -4
          echo "----------------------------------------"
          echo "Mac Username: runner"
          echo "Mac Password: (Leave Blank / No Password configured by GitHub)"
          echo "----------------------------------------"
          echo "The workflow will remain active for 5 hours. Close it manually from GitHub when finished."
          
          # زنده نگه داشتن کل ورک‌فلو به مدت ۵ ساعت جهت ریموت زدن شما
          sleep 18000
          
