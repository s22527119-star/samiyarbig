name: Hosted macOS 16vCPU Environment

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: avrea-macos-26-16-vcpu 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. راه‌اندازی شبکه Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          
          echo "==== Connecting to Tailscale ===="
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. ساخت کاربر جدید برای لاگین به دسکتاپ مک (سازگار با مک‌او‌اس Sequoia)
      - name: Create macOS Local User
        run: |
          echo "==== Creating GUI User ===="
          # ساخت یک یوزر ادمین به نام vncuser با رمز mac2026!
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "mac2026!" -admin
          
          # اطمینان از اینکه یوزر در صفحه لاگین مخفی نیست
          sudo dscl . -create /Users/vncuser IsHidden 0

      # ۳. فعال‌سازی VNC با محدودیت ۸ کاراکتر و دادن دسترسی به یوزر جدید
      - name: Enable Legacy VNC for macOS
        run: |
          echo "==== Configuring Apple Remote Desktop ===="
          VNC_PASS="mac2026!"
          
          # استارت سرویس و تنظیم رمز ۸ کاراکتری
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvncmanaged -vncmanaged -initialation
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvncpw -vncpw "$VNC_PASS"
          
          # دادن مجوز صریح ریموت دسکتاپ به کاربری که در مرحله قبل ساختیم
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -users vncuser -access -on -privs -all
          
          # ری‌استارت سرویس جهت اعمال تغییرات
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

      # ۴. بیدار نگه داشتن دیسپلی
      - name: Prevent Sleep
        run: |
          echo "==== Forcing macOS to stay awake ===="
          sudo caffeinate -disu &

      # ۵. دریافت اطلاعات اتصال
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect ===="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "-----------------------------------"
          echo "VNC Password (for VNC Viewer): mac2026!"
          echo "macOS Username (for Login Screen): vncuser"
          echo "macOS Password (for Login Screen): mac2026!"

      # ۶. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "Runner is perfectly running with 16 vCPUs. Connect now!"
          sleep 7200
          
