name: Hosted macOS 16vCPU Environment (NoMachine Fix)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: avrea-macos-26-16-vcpu 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. راه‌اندازی شبکه Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. ساخت کاربر ادمین برای سیستم
      - name: Create macOS User
        run: |
          echo "==== Creating GUI User ===="
          sudo sysadminctl -addUser nxuser -fullName "NoMachine Admin" -password "mac2026!" -admin
          sudo dscl . -create /Users/nxuser IsHidden 0
          
          # جلوگیری از به خواب رفتن دیسپلی و هارد
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0

      # ۳. نصب NoMachine
      - name: Install NoMachine
        run: |
          echo "==== Downloading and Installing NoMachine ===="
          brew install --cask nomachine

      # ۴. فعال‌سازی مانیتور مجازی با ابزار بومی و پیش‌فرض مک (حل قطعی ارور)
      - name: Activate Native macOS Virtual Display
        run: |
          echo "==== Activating Built-in macOS Framebuffer ===="
          # تنظیم رزولوشن دسکتاپ مجازی به صورت مستقیم در سیستم‌عامل
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
          
          echo "==== Starting CoreGraphics Virtual Session ===="
          # نسخه اصلاح‌شده: اجرای ابزار مدیریت ریموت دسکتاپ بومی اپل برای بالا آوردن محیط گرافیکی
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on
          
          echo "==== Forcing WindowServer to Boot GUI ===="
          # ری‌استارت و شوک به گرافیک برای لود کامل دسکتاپ
          sudo launchctl kickstart -k system/com.apple.WindowServer || true
          sleep 5
   
      # ۵. راه‌اندازی مجدد سرویس NoMachine جهت همگام‌سازی با مانیتور جدید
      - name: Configure and Start NoMachine Server
        run: |
          echo "==== Restarting NX Service ===="
          sudo /etc/NX/nxserver --restart
          sudo /etc/NX/nxserver --status



      # ۵. راه‌اندازی مجدد سرویس NoMachine جهت همگام‌سازی با مانیتور جدید
      - name: Configure and Start NoMachine Server
        run: |
          echo "==== Restarting NX Service ===="
          sudo /etc/NX/nxserver --restart
          sudo /etc/NX/nxserver --status

      # ۶. اطلاعات اتصال
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect ===="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Port: 4000"
          echo "Username: nxuser"
          echo "Password: mac2026!"

      # ۷. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          sleep 7200
          
