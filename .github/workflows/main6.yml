name: Hosted macOS 16vCPU (RustDesk + Tailscale Fix v3)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: namespace-profile-samiyarbig # رانر اختصاصی شما

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. اتصال به Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. نصب RustDesk و ابزارهای صوتی با نام اصلاح شده (switchaudio-osx)
      - name: Install RustDesk and Audio Utilities via Homebrew
        run: |
          echo "==== Installing RustDesk and Tools ===="
          brew install --cask rustdesk || true
          brew install blackhole-2ch || true
          
          # نصب با نام دقیق و درست برای رفع ارور گیت‌هاب
          brew install switchaudio-osx
          
          # رفرش کردن سیستم صوتی مک
          sudo killall coreaudiod || true
          sleep 3

      # ۳. تنظیم پسورد و فعال‌سازی سرویس پس‌زمینه RustDesk
      - name: Configure RustDesk & macOS Permissions
        run: |
          echo "==== Configuring RustDesk and Accessibility ===="
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement PrivacyInquiry -bool false || true
          
          # تنظیم رمز عبور ثابت برای اتصال مستقیم
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password mac2026! || true
          
          # فعال‌سازی قابلیت اتصال مستقیم با آی‌پي (Direct IP Access)
          sudo defaults write com.carriez.RustDesk.plist direct-server y || true
          
          # اجرای RustDesk در سطح سیستم (بدون قفل شدن ترمینال)
          nohup sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --service > /dev/null 2>&1 &
          sleep 5

      # ۴. مسیردهی صدای دسکتاپ به کارت صدای مجازی با دستور اصلاح شده
      - name: Route Screen Audio to Virtual Driver
        run: |
          echo "==== Routing macOS System Audio ===="
          # استفاده از دستور دقیق پکیج switchaudio-osx برای انتقال صدا به لایه ضبط راست‌دسک
          SwitchAudioSource -s "BlackHole 2ch" || true

      # ۵. بیدارباش کامل محیط گرافیکی و کپچر سیستم (Caffeinate)
      - name: Keep Video Framebuffer Alive
        run: |
          echo "==== Preventing macOS Graphics from Sleeping ===="
          sudo caffeinate -u -d -i -s -t 7200 &
          sleep 2

      # ۶. نمایش اطلاعات اتصال مستقیم
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect via RustDesk ===="
          echo "------------------------------------------------"
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "RustDesk Password: mac2026!"
          echo "------------------------------------------------"
          echo "HOW TO CONNECT:"
          echo "1. Open RustDesk on your local PC."
          echo "2. In the 'Control Remote Desktop' box, type the Tailscale IP exactly."
          echo "3. Enter the password 'mac2026!' when prompted."
          echo "------------------------------------------------"

      # ۷. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "==== Runner is alive and streaming ===="
          sleep 7200
          
