name: Hosted macOS 16vCPU Environment (NoMachine Fix)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: namespace-profile-samiyarbig

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. راه‌اندازی شبکه Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. ساخت کاربر ادمین برای سیستم و تنظیمات مدیریت توان
      - name: Create macOS User
        run: |
          echo "==== Creating GUI User ===="
          sudo sysadminctl -addUser nxuser -fullName "NoMachine Admin" -password "mac2026!" -admin
          sudo dscl . -create /Users/nxuser IsHidden 0
          
          # جلوگیری از به خواب رفتن دیسپلی و هارد
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0

      # ۳. نصب NoMachine
      - name: Install NoMachine
        run: |
          echo "==== Downloading and Installing NoMachine ===="
          brew install --cask nomachine

      # ۴. اعطای دسترسی Screen Recording، صدا و کنترل حرکتی (حل مشکل صفحه سیاه)
      - name: Grant Screen Recording and Audio Permissions
        run: |
          echo "==== Injecting Permissions into macOS TCC Database ===="
          # مسیرهای اصلی باینری‌های NoMachine که نیاز به کپچر دارند
          NX_SERVER="/Library/Application Support/NoMachine/bin/nxserver.bin"
          NX_NODE="/Library/Application Support/NoMachine/bin/nxnode.bin"
          
          # تزریق دسترسی ضبط صفحه (Screen Recording) برای هر دو پروسه اصلی نوماشین
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$NX_SERVER',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$NX_NODE',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          
          # تزریق دسترسی کنترل ماوس و کیبورد (Accessibility)
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','$NX_SERVER',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','$NX_NODE',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          
          # ریست کردن کش سیستم امنیتی برای لود مجدد دسترسی‌ها
          sudo tccutil reset ScreenCapture || true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement PrivacyInquiry -bool false || true

      # ۵. تنظیمات صوتی و راه‌اندازی دسکتاپ مجازی نوماشین
      - name: Configure and Start NoMachine Server
        run: |
          echo "==== Configuring NoMachine Features ===="
          # فعال‌سازی مانیتور مجازی و استریم صدا در کانفیگ نوماشین
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey ScreenResolution 1920x1080 || true
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --virtualdisplay add --shared || true
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey PhysicalDisplayAllowVirtualInbound yes || true
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey EnableAudioStreaming yes || true
          
          # اعطای دسترسی صدا و ورودی به یوزر جدید
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --ruleadd user=nxuser class=input service=yes || true
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --ruleadd user=nxuser class=audio service=yes || true
          
          echo "==== Restarting NX Service ===="
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --restart
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --status

      # ۶. بیدار نگه داشتن فریم‌بافر دسکتاپ
      - name: Wake Graphics Framebuffer
        run: |
          echo "==== Keeping Screen Active via Caffeinate ===="
          sudo caffeinate -u -d -i -s -t 7200 &
          sleep 2

      # ۷. اطلاعات اتصال
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect ===="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Port: 4000"
          echo "Username: nxuser"
          echo "Password: mac2026!"

      # ۸. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "==== Session is active ===="
          sleep 7200
          
