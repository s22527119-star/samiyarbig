name: Hosted macOS 16vCPU (Native Apple Remote + Audio Fix)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: namespace-profile-samiyarbig # رانر اختصاصی شما

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. اتصال به Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. فعال‌سازی ریموت دسکتاپ بومی اپل (Screen Sharing / VNC) با دسترسی کامل
      - name: Enable Native Apple Remote Desktop & Inputs
        run: |
          echo "==== Activating Apple Remote Management ===="
          # ایجاد یک پسورد ادمین برای یوزر runner جهت لاگین از راه دور
          sudo dscl . -passwd /Users/runner mac2026! || echo "runner" | sudo passwd runner
          
          # فعال‌سازی سرویس بومی ریموت دسکتاپ اپل با تمام دسترسی‌های کیبورد، ماوس و تصویر
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpasswd -vncpasswd mac2026! \
            -privs -all -restart -agent -menu

      # ۳. نصب درایور صوتی بومی و مسیردهی صدای دسکتاپ
      - name: Install Virtual Audio Driver for Sound
        run: |
          echo "==== Installing BlackHole Audio Driver ===="
          brew install blackhole-2ch || true
          brew install switchaudio-osx || true
          
          # رفرش کردن سیستم صوتی مک
          sudo killall coreaudiod || true
          sleep 3
          
          # مسیردهی کل صدای مک به کارت صدای مجازی جهت کپچر صوتی
          SwitchAudioSource -s "BlackHole 2ch" || true

      # ۴. بیدارباش کامل محیط گرافیکی و کپچر سیستم (Caffeinate)
      - name: Keep Video Framebuffer Alive
        run: |
          echo "==== Preventing macOS Graphics from Sleeping ===="
          sudo caffeinate -u -d -i -s -t 7200 &
          sleep 2

      # ۵. نمایش اطلاعات اتصال مستقیم با آی‌پی
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect via Apple Screen Sharing / VNC ===="
          echo "------------------------------------------------"
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Username: runner"
          echo "Password: mac2026!"
          echo "VNC Password: mac2026!"
          echo "------------------------------------------------"
          echo "HOW TO CONNECT:"
          echo "If you are on a Mac: Open 'Screen Sharing' app and enter the Tailscale IP."
          echo "If you are on Windows: Open any VNC Client (like RealVNC Viewer or TightVNC) and enter: TAILSCALE_IP:5900"
          echo "------------------------------------------------"

      # ۶. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "==== Runner is alive and streaming ===="
          sleep 7200
          
