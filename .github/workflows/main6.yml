name: Hosted macOS 16vCPU (NoMachine Audio/Video Fix)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: namespace-profile-samiyarbig # رانر اختصاصی جدید شما

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. اتصال به Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. دانلود و نصب مطمئن NoMachine (دور زدن ارور چک‌سام هوم‌برو)
      - name: Install NoMachine Server
        run: |
          echo "==== Downloading and Installing NoMachine ===="
          brew install --cask nomachine

      # ۳. اعطای دسترسی‌های کامل تصویری، صوتی و حرکتی به NoMachine در مک ۲۶ Tahoe
      - name: Configure NoMachine Permissions & Virtual Display
        run: |
          echo "==== Configuring macOS Graphics and Inputs for NoMachine ===="
          # ایجاد کارت گرافیک و مانیتور مجازی در هسته رانر (حل مشکل سیاه شدن صفحه)
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey ScreenResolution 1920x1080
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --virtualdisplay add --shared
          
          # فعال‌سازی و باز کردن قفل ورودی‌های کیبورد، ماوس و استریم صدا بدون نیاز به مانیتور فیزیکی
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey PhysicalDisplayAllowVirtualInbound yes
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey EnableUserInterface yes
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --configkey EnableAudioStreaming yes
          
          # اضافه کردن یوزر رانر گیت‌هاب به لایسنس مجاز کنترل سخت‌افزاری
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --ruleadd user=runner class=input service=yes
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --ruleadd user=runner class=audio service=yes
          
          # تزریق مستقیم شناسه نوماشین به دیتابیس حریم خصوصی مک (Bypass Screen Recording & Accessibility)
          NX_PATH="/Library/Application Support/NoMachine/bin/nxserver.bin"
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$NX_PATH',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','$NX_PATH',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true

          # راه‌اندازی مجدد سرویس نوماشین برای اعمال درایورهای جدید
          sudo /Library/Application\ Support/NoMachine/bin/nxserver --restart

      # ۴. نصب درایور صوتی بومی و مسیردهی صدای دسکتاپ
      - name: Install Virtual Audio Driver for Sound
        run: |
          echo "==== Installing BlackHole Audio Driver ===="
          brew install blackhole-2ch
          
          # رفرش کردن سیستم صوتی مک
          sudo killall coreaudiod || true
          sleep 3
          
          # مسیردهی کل صدای مک به کارت صدای مجازی جهت ضبط توسط نوماشین (Screen Recording Audio)
          sudo SwitchAudioSource -s "BlackHole 2ch" || true

      # ۵. بیدارباش کامل محیط گرافیکی و کپچر سیستم
      - name: Keep Video Framebuffer Alive
        run: |
          echo "==== Preventing macOS Graphics from Sleeping ===="
          sudo caffeinate -u -d -i -s -t 7200 &
          sleep 2

      # ۶. نمایش اطلاعات اتصال
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect via NoMachine ===="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "------------------------------------------------"
          echo "Mac Username: runner"
          echo "Mac Password: (Leave Blank / No Password configured by GitHub)"
          echo "------------------------------------------------"
          echo "1. Open NoMachine Client on your local PC."
          echo "2. Add a new connection with the Tailscale IP."
          echo "3. Connect using username 'runner' and empty password."

      # ۷. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "==== Runner is alive and streaming ===="
          sleep 7200
          
