name: Hosted macOS 16vCPU (Native Apple Remote + Audio Fix v2)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: getmac 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # ۱. اتصال به Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. ساخت یک یوزر اختصاصی جدید بدون نیاز به پسورد قبلی رانر
      - name: Create Dedicated Remote User
        run: |
          echo "==== Creating Remote User 'samiyar' ===="
          # پاک کردن یوزر اگر از قبل وجود داشته باشد برای جلوگیری از تداخل
          sudo dscl . -delete /Users/samiyar || true
          
          # ساخت یوزر جدید به نام samiyar
          sudo dscl . -create /Users/samiyar
          sudo dscl . -create /Users/samiyar UserShell /bin/zsh
          sudo dscl . -create /Users/samiyar RealName "Samiyar Big"
          sudo dscl . -create /Users/samiyar UniqueID "555"
          sudo dscl . -create /Users/samiyar PrimaryGroupID 20
          sudo dscl . -create /Users/samiyar NFSHomeDirectory /Users/samiyar
          
          # ست کردن پسورد مستقیم و اجباری برای یوزر جدید
          sudo dscl . -passwd /Users/samiyar mac2026!
          
          # اضافه کردن یوزر جدید به گروه ادمین‌ها برای داشتن دسترسی کامل ریموت
          sudo dscl . -append /Groups/admin GroupMembership samiyar
          
          # ساخت فولدر خانگی برای یوزر جدید
          sudo mkdir -p /Users/samiyar
          sudo chown -R samiyar:staff /Users/samiyar

      # ۳. فعال‌سازی ریموت دسکتاپ با سینتکس دقیق و تصحیح‌شده kickstart
      - name: Enable Native Apple Remote Desktop & VNC
        run: |
          echo "==== Activating Apple Remote Management with Correct Options ===="
          
          # فعال‌سازی اولیه سرویس ریموت
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate
          
          # تنظیم دسترسی کامل برای همه یوزرها به خصوص یوزر جدیدی که ساختیم
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          
          # تنظیم پسورد VNC با آرگومان‌های کاملاً دقیق طبق هلپ سیستم شما (-setvncpw -vncpw)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy yes -setvncpw yes -vncpw mac2026!
          
          # ری‌استارت نهایی دیمون ریموت دسکتاپ
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

      # ۴. نصب ابزارهای صوتی
      - name: Install Audio Utilities via Homebrew
        run: |
          echo "==== Installing Audio Tools ===="
          brew install blackhole-2ch || true
          brew install switchaudio-osx || true
          
          sudo killall coreaudiod || true
          sleep 3
          
          # انتقال خروجی صدا به کارت صدای مجازی
          SwitchAudioSource -s "BlackHole 2ch" || true

      # ۵. بیدارباش کامل محیط گرافیکی و کپچر سیستم (Caffeinate)
      - name: Keep Video Framebuffer Alive
        run: |
          echo "==== Preventing macOS Graphics from Sleeping ===="
          sudo caffeinate -u -d -i -s -t 7200 &
          sleep 2

      # ۶. نمایش اطلاعات اتصال مستقیم با آی‌پي تیل‌اسکیل
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect via Apple Screen Sharing / VNC ===="
          echo "------------------------------------------------"
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Username: samiyar"
          echo "Password: mac2026!"
          echo "VNC Password: mac2026!"
          echo "------------------------------------------------"
          echo "HOW TO CONNECT:"
          echo "If you are on a Mac: Open 'Screen Sharing' app and enter the Tailscale IP."
          echo "If you are on Windows: Open VNC Viewer (RealVNC/TightVNC) and enter: TAILSCALE_IP:5900"
          echo "------------------------------------------------"

      # ۷. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "==== Runner is alive and streaming ===="
          sleep 7200
          
