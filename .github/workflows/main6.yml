name: Hosted macOS 16vCPU (RustDesk + Tailscale Fix)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: namespace-profile-samiyarbig # رانر اختصاصی شما

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۱. اتصال به Tailscale
      - name: Install and Connect Tailscale
        run: |
          echo "==== Installing Tailscale ===="
          brew install tailscale
          sudo brew services start tailscale
          sudo ln -s /opt/homebrew/bin/tailscale /usr/local/bin/tailscale || true
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

      # ۲. نصب راحت و تمیز RustDesk از طریق هوم‌برو
      - name: Install RustDesk via Homebrew
        run: |
          echo "==== Installing RustDesk ===="
          brew install --cask rustdesk

      # ۳. اعطای دسترسی‌های ضبط صفحه، ماوس و کیبورد به RustDesk در مک ۲۶ Tahoe
      - name: Configure macOS Privacy for RustDesk (TCC Bypass)
        run: |
          echo "==== Injecting RustDesk Permissions into Tahoe TCC ===="
          # پیدا کردن مسیر دقیق باینری RustDesk
          RUSTDESK_PATH="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          
          # تزریق مستقیم مجوز ضبط صفحه (Screen Recording) و کنترل ماوس/کیبورد (Accessibility)
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$RUSTDESK_PATH',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','$RUSTDESK_PATH',1,1,1,NULL,NULL,NULL,'UNUSED',NULL,0,$(date +%s));" || true
          
          # ریست کردن کش سیستم امنیتی برای اعمال دسترسی‌ها
          sudo tccutil reset ScreenCapture || true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement PrivacyInquiry -bool false || true

      # ۴. تنظیم پسورد ثابت و فعال‌سازی سرویس پس‌زمینه RustDesk
      - name: Start RustDesk Service & Set Password
        run: |
          echo "==== Starting RustDesk Service and Setting Password ===="
          # تنظیم رمز عبور ثابت برای اتصال (مثلاً: mac2026!)
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password mac2026! || true
          
          # فعال‌سازی قابلیت Direct IP Access (اتصال مستقیم از طریق آی‌پی تیل‌اسکیل بدون نیاز به اینترنت)
          sudo defaults write com.carriez.RustDesk.plist direct-server y || true
          
          # اجرای پروسه اصلی در پس‌زمینه رانر
          nohup sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --service > /dev/null 2>&1 &
          sleep 5

      # ۵. نصب درایور صوتی بومی و مسیردهی صدای دسکتاپ
      - name: Install Virtual Audio Driver for Sound
        run: |
          echo "==== Installing BlackHole Audio Driver ===="
          brew install blackhole-2ch
          sudo killall coreaudiod || true
          sleep 2
          sudo SwitchAudioSource -s "BlackHole 2ch" || true

      # ۶. بیدارباش کامل محیط گرافیکی و کپچر سیستم (Caffeinate)
      - name: Keep Video Framebuffer Alive
        run: |
          echo "==== Preventing macOS Graphics from Sleeping ===="
          sudo caffeinate -u -d -i -s -t 7200 &
          sleep 2

      # ۷. نمایش اطلاعات اتصال مستقیم
      - name: Get Connection Details
        run: |
          echo "==== Ready to Connect via RustDesk ===="
          echo "------------------------------------------------"
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "RustDesk Password: mac2026!"
          echo "------------------------------------------------"
          echo "HOW TO CONNECT:"
          echo "1. Open RustDesk on your local PC."
          echo "2. In the 'Control Remote Desktop' box, type the Tailscale IP exactly."
          echo "3. Enter the password 'mac2026!' when prompted."
          echo "------------------------------------------------"

      # ۸. زنده نگه داشتن رانر
      - name: Keep Runner Alive
        run: |
          echo "==== Runner is alive and streaming ===="
          sleep 7200
          
