name: macOS M4 One-Click Tailscale VNC
on: workflow_dispatch

jobs:
  build:
    name: "M4 Infrastructure Simulation"
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. نصب Tailscale
      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5

      # ۲. دریافت لینک لاگین Tailscale
      - name: Tailscale Login Link
        run: |
          sudo tailscale up 2>&1 | tee /tmp/ts_up.log &
          sleep 5
          echo "======================================================="
          echo "🔗 لینک لاگین Tailscale را باز کنید و تایید کنید:"
          TS_LINK=$(grep -o 'https://login.tailscale.com/a/[a-zA-Z0-9]*' /tmp/ts_up.log)
          echo "👉 $TS_LINK 👈"
          echo "======================================================="
          
          # انتظار برای اتصال (حداکثر ۵ دقیقه)
          timeout 300 bash -c 'until tailscale ip -4 &>/dev/null; do sleep 3; done'
          
          TS_IP=$(tailscale ip -4)
          echo "✅ متصل شد! آی‌پی شما: $TS_IP"
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV
          
      - name: Setup Native macOS VNC
        run: |
          # فعال‌سازی Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate

          # تنظیم پسورد VNC به صورت مستقیم در فایل پیکربندی (بدون دخالت dscl)
          # پسورد را '123456' ست می‌کنیم
          echo "123456" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; chomp(my $p = <STDIN>); print pack "C*", map { $p =~ s/(.)//s ? ord($1) ^ shift(@k) : shift(@k) } 0..15' > /tmp/.vncpasswd
          sudo mkdir -p /Library/Application\ Support/Apple/Remote\ Desktop/
          sudo cp /tmp/.vncpasswd /Library/Application\ Support/Apple/Remote\ Desktop/VNCConfig.passwd
          
          # تنظیم دسترسی‌ها و فعال‌سازی پروتکل VNC Legacy
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -access -on \
            -privs -all -allowAccessFor -allUsers \
            -clientopts -setvnclegacy -vnclegacy yes
          
          # ریستارت سرویس برای اعمال تغییرات بدون درخواست پسورد قدیمی
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
          
          echo "✅ VNC Server is running on Tailscale IP."
          echo "✅ Use Password: 123456"


      # ۴. پیدا کردن Dockerfile
      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name "Dockerfile" -o -name "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "FROM alpine" > Dockerfile
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
          fi

      # ۵. تنظیمات داکر (فیک) برای لاگین در GHCR
      - name: Manual Registry Auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      # ۶. نصب Depot و بیلد (بدون نیاز به داکر محلی)
      - name: Install Depot CLI
        run: brew install depot/tap/depot

      - name: Depot Build and Push
        run: |
          depot build . \
            --project 2hwk5n6kr1 \
            --file ${{ steps.find-dockerfile.outputs.path }} \
            --push \
            --tag ghcr.io/${{ github.repository_owner }}/m4-sim-image:latest
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }} 

      # ۷. زنده نگه داشتن سیستم
      - name: Ready to Connect
        run: |
          echo "======================================================="
          echo "🖥 سیستم آماده اتصال است!"
          echo "۱. در کامپیوتر خود نرم‌افزار VNC Viewer را باز کنید."
          echo "۲. به این آی‌پی وصل شوید: ${{ env.TS_IP }}"
          echo "۳. در کادر پسورد بنویسید: 123456"
          echo "⚠️ توجه: اگر کادر یوزرنیم ظاهر شد، آن را خالی بگذارید."
          echo "======================================================="
          sleep 21600
          
