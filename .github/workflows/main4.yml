name: macOS Depot Build & Remote VNC
on: workflow_dispatch

jobs:
  build:
    name: "M4 Pro Infrastructure Simulation"
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. نصب ابزارهای شبکه و VNC
      - name: Install Networking Tools
        run: |
          brew install cloudflared
          git clone https://github.com/novnc/noVNC.git /tmp/novnc
          python3 -m venv $GITHUB_WORKSPACE/venv
          $GITHUB_WORKSPACE/venv/bin/pip install websockify

      # ۲. فعال‌سازی VNC
      - name: Enable Remote Desktop
        run: |
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement ARD_AllLocalUsers -bool true
          echo "123456" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; chomp(my $p = <STDIN>); print pack "C*", map { $p =~ s/(.)//s ? ord($1) ^ shift(@k) : shift(@k) } 0..15' > /tmp/.vncpasswd
          sudo mkdir -p /Library/Application\ Support/Apple/Remote\ Desktop/
          sudo cp /tmp/.vncpasswd /Library/Application\ Support/Apple/Remote\ Desktop/VNCConfig.passwd
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

      # ۳. اجرای تونل کلودفلر و noVNC
      - name: Start Web Access Tunnel
        run: |
          $GITHUB_WORKSPACE/venv/bin/python3 -m websockify --web /tmp/novnc 6080 localhost:5900 > websockify.log 2>&1 &
          echo "------------------------------------------------"
          echo "👇 LOOK FOR CLOUDFLARE URL BELOW:"
          cloudflared tunnel --url http://localhost:6080 &
          echo "------------------------------------------------"
          sleep 15

      # ۴. پیدا کردن هوشمند Dockerfile
      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name "Dockerfile" -o -name "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "FROM alpine" > Dockerfile
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
          fi

      # ۵. شبیه‌سازی تنظیمات داکر برای لاگین در GHCR (بدون نیاز به نصب داکر)
      - name: Manual Registry Auth
        run: |
          # ساخت فولدر تنظیمات داکر
          mkdir -p ~/.docker
          # ایجاد توکن Base64 برای لاگین
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          # ساخت فایل config.json که Depot از آن استفاده می‌کند
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json
          echo "✅ Fake Docker config created for GHCR."

      # ۶. نصب Depot CLI و بیلد نهایی
      - name: Install Depot CLI
        run: brew install depot/tap/depot

      - name: Depot Build and Push
        run: |
          # حالا Depot به صورت خودکار فایل config.json را می‌خواند
          depot build . \
            --project 2hwk5n6kr1 \
            --file ${{ steps.find-dockerfile.outputs.path }} \
            --push \
            --tag ghcr.io/${{ github.repository_owner }}/m4-sim-image:latest
        env:
          # برای احراز هویت با پروژه Depot (الزامی)
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }} 

      # ۷. زنده نگه داشتن سیستم
      - name: Keep Alive
        run: |
          echo "✅ BUILD FINISHED!"
          echo "VNC Password: 123456"
          sleep 21600
          
