name: macOS M4 Native Tailscale VNC
on: workflow_dispatch

jobs:
  build:
    name: "M4 Infrastructure Simulation"
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. نصب Tailscale
      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5

      # ۲. دریافت لینک لاگین Tailscale و انتظار
      - name: Tailscale Login Link
        run: |
          sudo tailscale up 2>&1 | tee /tmp/ts_up.log &
          sleep 5
          echo "======================================================="
          echo "🔗 لینک لاگین Tailscale را باز کنید و تایید کنید:"
          TS_LINK=$(grep -o 'https://login.tailscale.com/a/[a-zA-Z0-9]*' /tmp/ts_up.log)
          echo "👉 $TS_LINK 👈"
          echo "======================================================="
          
          echo "در حال انتظار برای تایید شما..."
          for i in {1..100}; do
            if tailscale ip -4 &>/dev/null; then
              echo "✅ دستگاه متصل شد!"
              break
            fi
            sleep 5
          done
          
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV

      # ۳. فعال‌سازی VNC بومی مک با ساخت یوزر جدید (حل مشکل پروتکل و پسورد)
      - name: Setup Native macOS VNC
        run: |
          # ساخت یک یوزر ادمین جدید در مک
          sudo sysadminctl -addUser macuser -fullName "Mac User" -password "123456" -admin
          
          # اضافه کردن یوزر جدید به گروه دسترسی تصویر
          sudo dseditgroup -o edit -a macuser -t user com.apple.access_screensharing || true
          
          # روشن کردن سرویس استاندارد اسکرین شیرینگ مک
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # فعال‌سازی مدیریت ریموت فقط برای یوزر جدید (بدون ترفندهای مخرب)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users macuser -privs -all \
            -restart -agent
            
          # جلوگیری از خاموش شدن صفحه نمایش مک
          sudo defaults write /Library/Preferences/com.apple.screensaver loginWindowIdleTime 0
          caffeinate -d &
          
          echo "✅ سرور اورجینال مک راه‌اندازی شد."

      # ۴. پیدا کردن Dockerfile
      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name "Dockerfile" -o -name "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "FROM alpine" > Dockerfile
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
          fi

      # ۵. تنظیمات داکر برای GHCR
      - name: Manual Registry Auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      # ۶. نصب Depot و بیلد
      - name: Install Depot CLI
        run: brew install depot/tap/depot

      - name: Depot Build
        run: |
          depot build . \
            --project 2hwk5n6kr1 \
            --file ${{ steps.find-dockerfile.outputs.path }} \
            --push \
            --tag ghcr.io/${{ github.repository_owner }}/m4-sim-image:latest
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }} 

      # ۷. نمایش اطلاعات نهایی
      - name: Ready to Connect
        run: |
          echo "======================================================="
          echo "🖥 سیستم با موفقیت آماده شد!"
          echo "آی‌پی اتصال: ${{ env.TS_IP }}"
          echo "👤 یوزرنیم: macuser"
          echo "🔑 پسورد: 123456"
          echo "======================================================="
          sleep 21600
          
