name: macOS M4 Native Tailscale VNC (GUI Fix)
on: workflow_dispatch

jobs:
  build:
    name: "M4 Infrastructure Simulation"
    runs-on: avrea-macos-26-16-vcpu
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. نصب Tailscale
      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5

      # ۲. دریافت لینک لاگین Tailscale و انتظار
      - name: Tailscale Login Link
        run: |
          sudo tailscale up 2>&1 | tee /tmp/ts_up.log &
          sleep 5
          echo "======================================================="
          echo "🔗 لینک لاگین Tailscale را باز کنید و تایید کنید:"
          TS_LINK=$(grep -o 'https://login.tailscale.com/a/[a-zA-Z0-9]*' /tmp/ts_up.log)
          echo "👉 $TS_LINK 👈"
          echo "======================================================="
          
          echo "در حال انتظار برای تایید شما..."
          for i in {1..100}; do
            if tailscale ip -4 &>/dev/null; then
              echo "✅ دستگاه متصل شد!"
              break
            fi
            sleep 5
          done
          
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV

      # ۳. فعال‌سازی VNC روی یوزر اصلی (برای نمایش کامل GUI)
      - name: Setup Native macOS VNC (GUI Fix)
        run: |
          # جلوگیری از خوابیدن یا قفل شدن صفحه نمایش (برای جلوگیری از سیاه شدن VNC)
          sudo pmset displaysleep 0
          sudo pmset sleep 0
          defaults write com.apple.screensaver askForPassword -int 0
          caffeinate -d &
          
          # تزریق مستقیم فایل پسورد VNC (رمز: 123456)
          echo "123456" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; chomp(my $p = <STDIN>); print pack "C*", map { $p =~ s/(.)//s ? ord($1) ^ shift(@k) : shift(@k) } 0..15' > /tmp/.vncpasswd
          sudo mkdir -p /Library/Application\ Support/Apple/Remote\ Desktop/
          sudo cp /tmp/.vncpasswd /Library/Application\ Support/Apple/Remote\ Desktop/VNCConfig.passwd
          sudo chmod 644 /Library/Application\ Support/Apple/Remote\ Desktop/VNCConfig.passwd
          
          # فعال‌سازی دسترسی VNC برای یوزر runner (صاحبِ محیط گرافیکی) با پروتکل استاندارد
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users runner -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
          
          echo "✅ سرور گرافیکی VNC برای یوزر اصلی راه‌اندازی شد."

      # ۴. پیدا کردن Dockerfile
      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name "Dockerfile" -o -name "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "FROM alpine" > Dockerfile
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
          fi

      # ۵. تنظیمات داکر برای GHCR
      - name: Manual Registry Auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json 

      # ۶. نمایش اطلاعات نهایی
      - name: Ready to Connect
        run: |
          echo "======================================================="
          echo "🖥 سیستم با موفقیت آماده شد!"
          echo "آی‌پی اتصال: ${{ env.TS_IP }}"
          echo "👤 یوزرنیم (در صورت نیاز): runner"
          echo "🔑 پسورد: 123456"
          echo "⚠️ برای جلوگیری از ارور پروتکل و دیدن محیط دسکتاپ حتماً از نرم‌افزار TigerVNC استفاده کنید."
          echo "======================================================="
          sleep 21600
          
