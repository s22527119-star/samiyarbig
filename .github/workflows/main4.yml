name: macOS M4 One-Click Access
on: workflow_dispatch

jobs:
  build:
    name: "M4 Infrastructure Simulation"
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. نصب ابزارهای شبکه
      - name: Install Networking Tools
        run: |
          brew install cloudflared
          git clone https://github.com/novnc/noVNC.git /tmp/novnc
          python3 -m venv $GITHUB_WORKSPACE/venv
          $GITHUB_WORKSPACE/venv/bin/pip install websockify

      # ۲. تنظیم VNC برای ورود مستقیم و خودکار
      - name: Enable Zero-Config VNC
        run: |
          # فعال‌سازی دسترسی ریموت
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all
          
          # تنظیم پسورد بسیار ساده (فقط برای پروتکل) و فعال‌سازی حالت بدون یوزرنیم (Legacy)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw 1
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

      # ۳. اجرای تونل و تولید لینک "بدون پسورد"
      - name: Start Access Tunnel
        run: |
          $GITHUB_WORKSPACE/venv/bin/python3 -m websockify --web /tmp/novnc 6080 localhost:5900 > websockify.log 2>&1 &
          
          echo "------------------------------------------------"
          echo "🚀 سیستم آماده شد! روی لینک زیر کلیک کنید:"
          echo "منتظر لینک .trycloudflare.com باشید..."
          echo "بعد از کپی لینک، این عبارت را به آخرش بچسبانید تا بدون پسورد وارد شوید:"
          echo "/vnc.html?autoconnect=true&password=1"
          echo "------------------------------------------------"
          
          cloudflared tunnel --url http://localhost:6080 &
          sleep 15

      # ۴. پیدا کردن Dockerfile
      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name "Dockerfile" -o -name "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "FROM alpine" > Dockerfile
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
          fi

      # ۵. تنظیمات داکر (فیک) برای لاگین GHCR
      - name: Manual Registry Auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      # ۶. نصب Depot CLI و بیلد
      - name: Install Depot CLI
        run: brew install depot/tap/depot

      - name: Depot Build and Push
        run: |
          depot build . \
            --project 2hwk5n6kr1 \
            --file ${{ steps.find-dockerfile.outputs.path }} \
            --push \
            --tag ghcr.io/${{ github.repository_owner }}/m4-sim-image:latest
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }} 

      # ۷. زنده نگه داشتن سیستم
      - name: Keep Alive
        run: |
          echo "✅ محیط مک فعال است. از کار با آن لذت ببرید!"
          sleep 21600
          
