name: macOS Depot Build & Tailscale VNC
on: workflow_dispatch

jobs:
  build:
    name: "M4 Infrastructure Simulation"
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. نصب Tailscale
      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5

      # ۲. دریافت لینک لاگین Tailscale و انتظار برای تایید شما
      - name: Tailscale Login Link
        run: |
          # اجرای Tailscale در پس‌زمینه و ذخیره لاگ
          sudo tailscale up 2>&1 | tee /tmp/ts_up.log &
          sleep 5
          
          echo "======================================================="
          echo "🔗 لینک اختصاصی لاگین Tailscale شما آماده است:"
          # استخراج لینک از لاگ
          TS_LINK=$(grep -o 'https://login.tailscale.com/a/[a-zA-Z0-9]*' /tmp/ts_up.log)
          echo "👉 $TS_LINK 👈"
          echo "======================================================="
          echo "⏳ عملیات متوقف شد... لطفاً لینک بالا را باز کنید و تایید را بزنید."
          
          # توقف هوشمند تا زمانی که شما لینک را تایید کنید
          while ! tailscale ip -4 &> /dev/null; do
            sleep 3
          done
          
          TS_IP=$(tailscale ip -4)
          echo "✅ دستگاه متصل شد! آی‌پی Tailscale این مک: $TS_IP"
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV

      # ۳. فعال‌سازی VNC اورجینال مک
      - name: Setup Native macOS VNC
        run: |
          # تنظیم یک رمز ساده برای یوزر پیش‌فرض گیت‌هاب
          sudo dscl . -passwd /Users/runner 123456
          
          # روشن کردن VNC بومی سیستم
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw 123456 \
            -restart -agent
            
          echo "✅ سرور VNC با رمز 123456 راه‌اندازی شد."

      # ۴. پیدا کردن Dockerfile
      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name "Dockerfile" -o -name "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "FROM alpine" > Dockerfile
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
          fi

      # ۵. تنظیمات داکر برای GHCR
      - name: Manual Registry Auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      # ۶. نصب Depot و بیلد
      - name: Install Depot CLI
        run: brew install depot/tap/depot

      - name: Depot Build
        run: |
          depot build . \
            --project 2hwk5n6kr1 \
            --file ${{ steps.find-dockerfile.outputs.path }} \
            --push \
            --tag ghcr.io/${{ github.repository_owner }}/m4-sim-image:latest
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }} 

      # ۷. نمایش اطلاعات نهایی و زنده نگه داشتن سرور
      - name: Ready to Connect
        run: |
          echo "======================================================="
          echo "🖥 سیستم با موفقیت آماده شد!"
          echo "برای اتصال:"
          echo "۱. برنامه VNC Viewer (یا Screen Sharing در مک) را در کامپیوتر خود باز کنید."
          echo "۲. به این آی‌پی متصل شوید: $TS_IP"
          echo "۳. اطلاعات ورود:"
          echo "   👤 یوزرنیم: runner"
          echo "   🔑 پسورد: 123456"
          echo "======================================================="
          sleep 21600
          
