name: macOS Depot Build & Remote VNC
on: workflow_dispatch

jobs:
  build:
    name: "M4 Pro Simulation"
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. نصب ابزارهای شبکه
      - name: Install Networking Tools
        run: |
          brew install cloudflared
          git clone https://github.com/novnc/noVNC.git /tmp/novnc
          python3 -m venv $GITHUB_WORKSPACE/venv
          $GITHUB_WORKSPACE/venv/bin/pip install websockify

      # ۲. تنظیم VNC به صورتی که با نوتیفیکیشن و یوزرنیم مزاحم نشود
      - name: Enable Remote Desktop
        run: |
          # فعال‌سازی دسترسی کامل برای همه یوزرها
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all
          
          # فعال‌سازی حالت Legacy VNC (بدون نیاز به یوزرنیم) با یک پسورد ساده
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw 12345678
          
          # ریستارت سرویس برای اعمال تغییرات
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

      # ۳. اجرای تونل و noVNC
      - name: Start Web Access Tunnel
        run: |
          $GITHUB_WORKSPACE/venv/bin/python3 -m websockify --web /tmp/novnc 6080 localhost:5900 > websockify.log 2>&1 &
          echo "------------------------------------------------"
          echo "👇 لینک اختصاصی شما برای ورود بدون پسورد:"
          echo "منتظر لینک cloudflare باشید و به انتهای آن عبارت زیر را اضافه کنید:"
          echo "?autoconnect=true&password=12345678"
          echo "------------------------------------------------"
          cloudflared tunnel --url http://localhost:6080 &
          sleep 15

      # ۴. پیدا کردن Dockerfile
      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name "Dockerfile" -o -name "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "FROM alpine" > Dockerfile
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
          fi

      # ۵. تنظیمات داکر (فیک)
      - name: Manual Registry Auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      # ۶. نصب Depot CLI و بیلد
      - name: Install Depot CLI
        run: brew install depot/tap/depot

      - name: Depot Build and Push
        run: |
          depot build . \
            --project 2hwk5n6kr1 \
            --file ${{ steps.find-dockerfile.outputs.path }} \
            --push \
            --tag ghcr.io/${{ github.repository_owner }}/m4-sim-image:latest
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }} 

      # ۷. زنده نگه داشتن سیستم
      - name: Keep Alive
        run: |
          echo "✅ سیستم آماده است."
          sleep 21600
          
