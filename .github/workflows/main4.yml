name: macOS Depot Build & Remote VNC
on: workflow_dispatch

jobs:
  build:
    name: "M4 Pro Simulation"
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. نصب ابزارهای شبکه (VNC و Tunnel)
      - name: Install Networking Tools
        run: |
          brew install cloudflared
          git clone https://github.com/novnc/noVNC.git /tmp/novnc
          python3 -m venv $GITHUB_WORKSPACE/venv
          $GITHUB_WORKSPACE/venv/bin/pip install websockify

      # ۲. فعال‌سازی VNC (بدون نیاز به پسورد قدیمی سیستم)
      - name: Enable Remote Desktop
        run: |
          # فعال‌سازی سرویس Screen Sharing
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          
          # تنظیم پسورد VNC به صورت مستقیم (password123)
          # این دستور پسورد اختصاصی VNC را تنظیم می‌کند که نیازی به یوزرنیم ندارد
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncprinting -vncprinting yes \
            -clientopts -setvncpw -vncpw password123 \
            -restart -agent -privs -all
          
          echo "✅ VNC Legacy Password set to: password123"

      # ۳. اجرای تونل کلودفلر و noVNC
      - name: Start Web Access Tunnel
        run: |
          # اجرای websockify در پس‌زمینه
          $GITHUB_WORKSPACE/venv/bin/python3 -m websockify --web /tmp/novnc 6080 localhost:5900 > websockify.log 2>&1 &
          
          echo "------------------------------------------------"
          echo "👇 لینک ورود به محیط مک را اینجا پیدا کنید:"
          cloudflared tunnel --url http://localhost:6080 &
          echo "------------------------------------------------"
          sleep 15

      # ۴. پیدا کردن هوشمند Dockerfile
      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name "Dockerfile" -o -name "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "FROM alpine" > Dockerfile
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT
          fi

      # ۵. تنظیمات داکر برای لاگین در GHCR
      - name: Manual Registry Auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      # ۶. نصب Depot CLI و بیلد
      - name: Install Depot CLI
        run: brew install depot/tap/depot

      - name: Depot Build and Push
        run: |
          depot build . \
            --project 2hwk5n6kr1 \
            --file ${{ steps.find-dockerfile.outputs.path }} \
            --push \
            --tag ghcr.io/${{ github.repository_owner }}/m4-sim-image:latest
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }} 

      # ۷. زنده نگه داشتن سیستم
      - name: Keep Alive
        run: |
          echo "✅ سیستم آماده است."
          echo "رمز ورود به noVNC: password123"
          sleep 21600
          
